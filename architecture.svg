<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1160" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Kapruka Shopping Agent — Full-TypeScript Architecture</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b">Next.js · LangGraph.js · kapruka-mcp SDK (in-process) · single long-running instance</text>

  <!-- =================== LEFT RAIL: MEMORY & STATE =================== -->
  <rect x="40" y="98" width="262" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="171" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">MEMORY &amp; STATE</text>

  <rect x="40" y="350" width="262" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="376" font-size="13.5" font-weight="700" fill="#92400e">Conversation memory</text>
  <text x="56" y="397" font-size="12.5" fill="#78716c">LangGraph checkpointer</text>
  <text x="56" y="414" font-size="12.5" fill="#78716c">(Postgres / SQLite)</text>
  <text x="56" y="431" font-size="12" fill="#a8a29e">survives refresh · resumable</text>

  <rect x="40" y="618" width="262" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="644" font-size="13.5" font-weight="700" fill="#92400e">Cart + analytics</text>
  <text x="56" y="665" font-size="12.5" fill="#78716c">SQLite (SDK storage)</text>
  <text x="56" y="682" font-size="12" fill="#a8a29e">source of truth for cart;</text>
  <text x="56" y="699" font-size="12" fill="#a8a29e">powers recommendations</text>

  <!-- =================== RIGHT RAIL: OBSERVABILITY & RESILIENCE =================== -->
  <rect x="898" y="98" width="262" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1029" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">OBSERVABILITY &amp; RESILIENCE</text>

  <rect x="898" y="226" width="262" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="914" y="250" font-size="13.5" font-weight="700" fill="#065f46">/api/health + uptime monitor</text>
  <text x="914" y="271" font-size="12" fill="#4b5563">the "judges can open it" guarantee</text>

  <rect x="898" y="350" width="262" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="914" y="374" font-size="13.5" font-weight="700" fill="#065f46">LangSmith traces</text>
  <text x="914" y="395" font-size="12" fill="#4b5563">graph steps · tokens · per-node latency</text>

  <rect x="898" y="486" width="262" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="914" y="510" font-size="13.5" font-weight="700" fill="#065f46">Tool telemetry</text>
  <text x="914" y="531" font-size="12" fill="#4b5563">onToolCall / onError → structured logs</text>

  <rect x="898" y="618" width="262" height="74" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="914" y="642" font-size="13.5" font-weight="700" fill="#991b1b">Circuit breaker → mock</text>
  <text x="914" y="663" font-size="12" fill="#7f1d1d">if live MCP flaky, degrade browse to</text>
  <text x="914" y="680" font-size="12" fill="#7f1d1d">136-product mock catalog (honest UX)</text>

  <!-- =================== CENTRAL FLOW =================== -->
  <!-- L1 CLIENT -->
  <rect x="350" y="90" width="500" height="96" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="370" y="118" font-size="16" font-weight="700" fill="#3730a3">CLIENT — Full-screen Chat UI (React)</text>
  <text x="370" y="142" font-size="13" fill="#475569">streaming chat · product cards · carousels · cart drawer</text>
  <text x="370" y="163" font-size="13" fill="#475569">loading / empty / error states · responsive · accessible</text>

  <!-- L2 HOST -->
  <rect x="350" y="226" width="500" height="84" rx="12" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="370" y="254" font-size="16" font-weight="700" fill="#0369a1">HOST — Next.js (Node runtime)</text>
  <text x="370" y="278" font-size="13" fill="#475569">serves UI · /api/chat (SSE: tokens + render events)</text>
  <text x="370" y="299" font-size="13" fill="#475569">session id · env / secrets</text>

  <!-- L3 AGENT -->
  <rect x="350" y="350" width="500" height="124" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="370" y="378" font-size="16" font-weight="700" fill="#6d28d9">AGENT — LangGraph.js (the brain)</text>
  <text x="370" y="401" font-size="12.5" fill="#475569">typed state · tool calls · dual-channel output</text>
  <!-- node chips -->
  <rect x="370" y="416" width="86" height="26" rx="13" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="413" y="433" text-anchor="middle" font-size="11.5" fill="#5b21b6">Router</text>
  <rect x="464" y="416" width="96" height="26" rx="13" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="512" y="433" text-anchor="middle" font-size="11.5" fill="#5b21b6">Discovery</text>
  <rect x="568" y="416" width="64" height="26" rx="13" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="600" y="433" text-anchor="middle" font-size="11.5" fill="#5b21b6">Cart</text>
  <rect x="640" y="416" width="86" height="26" rx="13" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="683" y="433" text-anchor="middle" font-size="11.5" fill="#5b21b6">Delivery</text>
  <rect x="734" y="416" width="96" height="26" rx="13" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="782" y="433" text-anchor="middle" font-size="11.5" fill="#5b21b6">Checkout</text>
  <text x="370" y="461" font-size="12.5" fill="#475569">+ Responder (LLM, personality &amp; Sinhala/Tanglish) → streams reply</text>

  <!-- L4 PORT -->
  <rect x="350" y="514" width="500" height="54" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="538" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">CommercePort (interface) — dependency inversion boundary</text>
  <text x="600" y="557" text-anchor="middle" font-size="12" fill="#64748b">agent depends on this, never on the SDK directly · swap live ⇄ mock here</text>

  <!-- L5 ADAPTER -->
  <rect x="350" y="608" width="500" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="370" y="636" font-size="16" font-weight="700" fill="#0f766e">KaprukaAdapter → kapruka-mcp SDK (in-process)</text>
  <text x="370" y="660" font-size="13" fill="#475569">15 tools · 30-min read cache · rate-limit guard</text>
  <text x="370" y="681" font-size="13" fill="#475569">structured JSON · cart store · perishable logic</text>

  <!-- L6 EXTERNAL -->
  <rect x="350" y="748" width="500" height="92" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="776" font-size="16" font-weight="700" fill="#1e293b">mcp.kapruka.com → Kapruka.com</text>
  <text x="370" y="800" font-size="13" fill="#475569">real catalog · delivery quotes · guest checkout + pay link</text>
  <text x="370" y="821" font-size="13" fill="#475569">+ Frankfurter API (currency convert)</text>

  <!-- vertical flow arrows (double-headed) -->
  <line x1="600" y1="186" x2="600" y2="225" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="600" y1="310" x2="600" y2="349" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="600" y1="474" x2="600" y2="513" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="600" y1="568" x2="600" y2="607" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="600" y1="708" x2="600" y2="747" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- dashed rail connectors -->
  <line x1="302" y1="396" x2="349" y2="410" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dash)"/>
  <line x1="302" y1="660" x2="349" y2="658" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dash)"/>
  <line x1="898" y1="258" x2="851" y2="268" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dash)"/>
  <line x1="898" y1="382" x2="851" y2="405" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dash)"/>
  <line x1="898" y1="518" x2="851" y2="650" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dash)"/>
  <line x1="898" y1="655" x2="851" y2="672" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dash)"/>

  <!-- flow label -->
  <text x="624" y="210" font-size="11" fill="#94a3b8">user msg ↓   ·   tokens + render events ↑</text>

  <!-- =================== FOOTER: REQUEST LIFECYCLE =================== -->
  <rect x="40" y="892" width="1120" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="924" font-size="15" font-weight="700" fill="#0f172a">Request lifecycle — "birthday cake to Kandy on Saturday"</text>

  <text x="64" y="956" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#6d28d9">1.</tspan> Client streams user message to /api/chat → LangGraph state updated, Router classifies intent (discovery).</text>
  <text x="64" y="982" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#6d28d9">2.</tspan> Agent calls CommercePort.search("cake") → Adapter → SDK cache check → mcp.kapruka.com → typed JSON back.</text>
  <text x="64" y="1008" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#6d28d9">3.</tspan> Agent emits a PRODUCT_LIST render event (carousel renders) <tspan font-style="italic" fill="#64748b">while</tspan> the friendly reply is still streaming.</text>
  <text x="64" y="1034" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#6d28d9">4.</tspan> User picks one → check_delivery(KAN, date) validates perishable rule → DELIVERY_QUOTE event (LKR 350, 2 days).</text>
  <text x="64" y="1060" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#6d28d9">5.</tspan> add_to_cart → CART event + "goes well with" recommendations. Checkpointer persists the whole thread.</text>
  <text x="64" y="1086" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#6d28d9">6.</tspan> validate_shipping → create_order → CHECKOUT_LINK event renders a prominent pay button (60-min price lock).</text>
  <text x="64" y="1110" font-size="11.5" fill="#94a3b8">Every step traced in LangSmith; every tool call logged via SDK hooks; live failure trips the circuit breaker to mock for browse.</text>
</svg>
